<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ハートの回転を調整</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#141414;color:#eee;font:14px -apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}main{max-width:680px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:16px;font-weight:500;margin:0}button,a{font:inherit;color:inherit}button{border:1px solid #555;border-radius:5px;padding:8px 12px;background:transparent;cursor:pointer}button[aria-pressed=true],button.primary{background:#eee;color:#151515;border-color:#eee}button:disabled{opacity:.5;cursor:default}nav{display:flex;gap:6px}nav button{font-size:12px;padding:6px 9px}.stage{width:240px;height:240px;margin:26px auto 12px}.stage svg{display:block;width:100%;height:100%}.stage.black{background:#141414}.stage.white{background:#fff}.stage.checker{background-color:#fff;background-image:conic-gradient(#ddd 25%,transparent 0 50%,#ddd 0 75%,transparent 0);background-size:20px 20px}.playback{display:flex;gap:8px;justify-content:center}.playback button{font-size:12px}#summary{text-align:center;font-size:12px;color:#b9b9b9;line-height:1.7;margin:16px 0 26px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:24px 28px;border-top:1px solid #333;padding-top:24px}.control label{display:flex;justify-content:space-between;gap:10px;font-size:13px}.control output{font-variant-numeric:tabular-nums;color:#f48a9c}.control p{font-size:11px;color:#999;margin:7px 0 10px;min-height:16px}input[type=range]{width:100%;accent-color:#e65b76;cursor:pointer}.actions{border-top:1px solid #333;margin-top:24px;padding-top:20px;display:flex;align-items:center;gap:16px}.actions a{font-size:12px;text-underline-offset:4px}#status{font-size:12px;color:#bbb;min-height:20px;margin:12px 0 0}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #f48a9c;outline-offset:4px}@media(max-width:450px){main{padding:18px 14px}header{align-items:start;flex-direction:column}.controls{gap:22px 16px}.actions{flex-wrap:wrap}}
</style>
<main>
<header><h1>ハートの回転を調整</h1><nav aria-label="背景"><button data-background="black" aria-pressed="true">黒</button><button data-background="white" aria-pressed="false">白</button><button data-background="checker" aria-pressed="false">透過</button></nav></header>
<div id="art" class="stage black" aria-label="回転のプレビュー"></div>
<div class="playback"><button id="pause">一時停止</button><button id="burst">くるくるを見る</button><button id="restart">最初から</button></div>
<p id="summary">読み込み中…</p>
<div class="controls">
<div class="control"><label for="normalPeriod">普段の速さ <output id="normalPeriodValue"></output></label><p>一周にかかる時間。小さいほど速い。</p><input id="normalPeriod" type="range" min="4" max="20" step=".5" value="7.5"></div>
<div class="control"><label for="burstTurns">くるくるの強さ <output id="burstTurnsValue"></output></label><p>短い間に追加で回る回数。</p><input id="burstTurns" type="range" min="1" max="6" step="1" value="3"></div>
<div class="control"><label for="burstDuration">くるくるの長さ <output id="burstDurationValue"></output></label><p id="easeTiming">加速と減速は同じ長さです。</p><input id="burstDuration" type="range" min=".5" max="6" step=".1" value="2"></div>
<div class="control"><label for="intervalTurns">くるくるの間隔 <output id="intervalTurnsValue"></output></label><p>大きいほど、穏やかに回る時間が長くなる。</p><input id="intervalTurns" type="range" min="1" max="3" step="1" value="1"></div>
</div>
<div class="control" style="margin-top:24px"><label for="easeDuration">加速・減速の長さ <output id="easeDurationValue"></output></label><p>入りと抜けを、同じ長さでゆっくりにします。</p><input id="easeDuration" type="range" min=".1" max="2.25" step=".1" value="1.5"></div>
<div class="actions"><button class="primary" id="save" disabled>この設定に決める</button><a id="download" download="heart.svg">SVG をダウンロード</a></div>
<p id="status" role="status">ノブを動かすと、その場で回転が変わります。</p>
</main>
<script>
const keys=['normalPeriod','burstDuration','burstTurns','intervalTurns','easeDuration'];
const art=document.getElementById('art'),status=document.getElementById('status'),save=document.getElementById('save');
let paused=false,timer,request,version=0;
const settings=()=>Object.fromEntries(keys.map(key=>[key,Number(document.getElementById(key).value)]));
const animations=()=>art.getAnimations({subtree:true});
function labels(){const duration=document.getElementById('burstDuration');duration.max=Math.min(6,Number(document.getElementById('normalPeriod').value)*Number(document.getElementById('intervalTurns').value)-.5);const ease=document.getElementById('easeDuration');ease.max=Number(duration.value)/2;const s=settings();const ramp=s.easeDuration;document.getElementById('easeDurationValue').value='それぞれ '+ramp+'秒';document.getElementById('easeTiming').textContent='加速 '+ramp+'秒 → 一定 '+Number((s.burstDuration-ramp*2).toFixed(3))+'秒 → 減速 '+ramp+'秒';document.getElementById('normalPeriodValue').value=s.normalPeriod+'秒 / 周';document.getElementById('burstDurationValue').value=s.burstDuration+'秒';document.getElementById('burstTurnsValue').value='＋'+s.burstTurns+'回';document.getElementById('intervalTurnsValue').value=s.normalPeriod*s.intervalTurns+'秒ごと';document.getElementById('summary').textContent=(s.normalPeriod*s.intervalTurns*2)+'秒ループ · くるくるが2回 · 背景透過';}
function seek(seconds){animations().forEach(animation=>{animation.currentTime=seconds*1000});}
async function update(){
 const s=settings(),currentVersion=++version;request?.abort();request=new AbortController();save.disabled=true;
 try{
  const response=await fetch('/heart.svg?settings='+encodeURIComponent(JSON.stringify(s)),{signal:request.signal});
  if(!response.ok)throw new Error('プレビューを更新できませんでした');
  const svg=await response.text();if(currentVersion!==version)return;
  const time=Number(animations()[0]?.currentTime??0)/1000;
  art.innerHTML=svg;const duration=s.normalPeriod*s.intervalTurns*2;
  animations().forEach(animation=>{animation.currentTime=(time%duration)*1000;if(paused)animation.pause()});
  document.getElementById('download').href='/heart.svg?settings='+encodeURIComponent(JSON.stringify(s));save.disabled=false;
 }catch(error){if(error.name!=='AbortError')status.textContent=error.message;}
}
for(const key of keys)document.getElementById(key).addEventListener('input',()=>{labels();status.textContent='調整中 — 気に入ったら「この設定に決める」で反映できます。';save.disabled=true;clearTimeout(timer);timer=setTimeout(update,90)});
document.getElementById('pause').onclick=()=>{paused=!paused;animations().forEach(a=>paused?a.pause():a.play());document.getElementById('pause').textContent=paused?'再生':'一時停止'};
document.getElementById('restart').onclick=()=>seek(0);
document.getElementById('burst').onclick=()=>{const s=settings();seek((s.normalPeriod*s.intervalTurns-s.burstDuration)*.8);if(paused)document.getElementById('pause').click()};
for(const button of document.querySelectorAll('[data-background]'))button.onclick=()=>{art.className='stage '+button.dataset.background;document.querySelectorAll('[data-background]').forEach(b=>b.setAttribute('aria-pressed',b===button))};
save.onclick=async()=>{save.disabled=true;try{const response=await fetch('/motion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(settings())});if(!response.ok)throw new Error('保存できませんでした');status.textContent='この設定をハートのSVGに反映しました。GitHubへの公開はまだです。'}catch(error){status.textContent=error.message}finally{save.disabled=false}};
(async()=>{try{const response=await fetch('/motion');if(!response.ok)throw new Error('設定を読み込めませんでした');const s=await response.json();keys.forEach(key=>document.getElementById(key).value=s[key]);labels();await update()}catch(error){status.textContent=error.message}})();
</script>
</html>
